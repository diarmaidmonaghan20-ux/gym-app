<!DOCTYPE html>
<html lang="en-IE"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lambs">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Lamb tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: practical farm tool, quick to use in the yard on a phone.
   IDEA: the mart pen board — each group is a pen with a yellow ear tag for a name.
   PICTURE: the group cards themselves, with the estimated weight large and a bar toward the move-on weight.
   COLOUR and TYPE: deep grass green, white, ear-tag yellow accent; Barlow Condensed + Barlow.
   LAYOUT: green header band with flock totals, then jobs coming up, then the group pens. */
:root{color-scheme:light dark;--bg:light-dark(#f3f5ef,#0e1711);--card:light-dark(#fff,#16231a);--ink:light-dark(#15211a,#edf2ea);--mute:light-dark(#56665b,#9db0a1);--line:light-dark(#dce3d7,#2a3b2f);--green:#1d4728;--pri:light-dark(#1d4728,#3f8d52);--bar:light-dark(#2f6b3c,#7fc48f);--tag:#f3c400;--red:light-dark(#b3261e,#ff8f86);--redbg:light-dark(#fdecea,#3a1916);--soft:light-dark(#eef2ea,#1d2d21)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,.big,.tag,.stat b,.when{font-family:'Barlow Condensed',Barlow,sans-serif;font-weight:700;line-height:1.05}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(4vw,14px)}
.top{background:var(--green);color:#fff;padding-top:max(18px,env(safe-area-inset-top))}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
h1{font-size:clamp(36px,7vw,50px);margin:0}
.sync{font-size:13px;opacity:.8}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0 8px}
.stat{background:rgba(255,255,255,.09);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:30px;color:var(--tag);white-space:nowrap}
.stat span{font-size:13px;opacity:.85}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{flex:none;background:none;border:0;color:#fff;opacity:.75;font:600 16px Barlow,sans-serif;padding:10px 9px;min-height:46px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{opacity:1;border-color:var(--tag)}
main{padding-top:6px;padding-bottom:70px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 12px}
h2{font-size:30px;margin:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px Barlow,sans-serif;cursor:pointer}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.y{background:var(--tag);border-color:var(--tag);color:#1a1a1a}
.btn.d{color:var(--red)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tabs button:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.g{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{background:var(--tag);color:#1a1a1a;font-size:24px;padding:6px 14px 6px 30px;border-radius:8px 8px 16px 16px;position:relative;overflow-wrap:anywhere;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tag::before{content:'';position:absolute;left:10px;top:50%;width:11px;height:11px;margin-top:-5px;border-radius:50%;background:var(--card);box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.cnt{font-weight:600;color:var(--mute);white-space:nowrap}
.wt{display:flex;justify-content:space-between;align-items:flex-end;gap:4px 10px;flex-wrap:wrap}
.big{font-size:46px}.wt span{color:var(--mute)}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar);border-radius:6px}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;margin:0;font-size:15px}
dt{color:var(--mute)}dd{margin:0;text-align:right}
.due{color:var(--red);font-weight:600}
.chip{display:inline-block;background:var(--redbg);color:var(--red);font-weight:600;font-size:14px;border-radius:8px;padding:4px 10px}
.kind{display:inline-block;background:var(--soft);font-size:13px;font-weight:600;border-radius:6px;padding:2px 8px}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:auto}
.acts .btn{padding:0 4px}
.jobs{list-style:none;margin:0;padding:0}
.jobs li{display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.jobs li:first-child{border-top:0}
.when{font-size:21px}.when small{display:block;font:500 13px Barlow,sans-serif;color:var(--mute)}
.late .when,.late .when small{color:var(--red)}
summary{cursor:pointer;font-weight:600;padding:10px 0;min-height:44px}
.mute{color:var(--mute)}.sm{font-size:14px}
.proj{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.proj div{background:var(--soft);border-radius:10px;padding:8px 10px}
.proj b{display:block;font:700 22px/1.1 'Barlow Condensed',Barlow,sans-serif}
.proj span{font-size:13px;color:var(--mute)}
.pd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pd input{width:auto}
.hit td{font-weight:700;color:var(--bar)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.sum div{background:var(--soft);border-radius:10px;padding:10px 12px}
.sum b{display:block;font:700 26px/1.1 'Barlow Condensed',Barlow,sans-serif}.sum span{font-size:13px;color:var(--mute)}
.scanbox{display:grid;gap:6px;background:var(--soft);border-radius:12px;padding:12px}
.scanbox .btn{display:inline-grid;place-items:center;justify-self:start}
.filled{outline:2px solid var(--bar);outline-offset:1px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sh{background:var(--card);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 18px max(22px,env(safe-area-inset-bottom))}
@media(min-width:700px){.ov{align-items:center}.sh{border-radius:18px}}
.shh{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;background:var(--card);padding:14px 0 10px;z-index:1}
.shh h2{font-size:26px}
.x{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);font-size:26px;line-height:1;cursor:pointer}
form{display:grid;gap:12px}
.f{display:grid;gap:4px;font-weight:600;font-size:15px}
.f small{font-weight:400;color:var(--mute)}
input,select,textarea{font:16px Barlow,sans-serif;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
fieldset{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0;display:grid;gap:8px}
legend{font-weight:600;font-size:15px;padding:0 4px}
.ck{display:flex;align-items:center;gap:10px;min-height:42px;font-size:16px}
.ck input{width:22px;height:22px;min-height:22px;flex:none;accent-color:var(--pri)}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg label{flex:1;display:grid;place-items:center;min-height:42px;border-radius:8px;cursor:pointer;font-weight:600}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.prev{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:15px}
.dl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:20;font-weight:600}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mute);font-weight:600}
.n{text-align:right;white-space:nowrap}tfoot td{font-weight:700;border-bottom:0}
.empty{text-align:center;padding:40px 16px}.empty p{max-width:40ch;margin:8px auto 18px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.hist .x{width:40px;height:40px;font-size:20px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.big{font-size:40px}}
@media(max-width:600px){.stack thead,.stack tfoot td:empty{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:9em;text-align:start!important;white-space:normal}.stack td::before{content:attr(data-l);float:inline-start;width:8.5em;margin-inline-start:-9em;color:var(--mute);font-weight:400}.stack td:first-child{font-weight:700}.stack td:first-child::before{content:none}.stack td:first-child{padding-inline-start:0}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .5s}}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script></head><body>
<header class="top"><div class="wrap">
 <div class="brand"><h1>Lamb tracker</h1><span class="sync">Saved on this phone</span></div>
 <div class="stats" id="stats"></div>
 <nav class="tabs" id="tabs"><button data-t="flock" class="on">Groups</button><button data-t="doses">Doses</button><button data-t="sales">Sales</button><button data-t="more">Meal &amp; backup</button></nav>
</div></header>
<main class="wrap" id="view"></main>
<div id="ov" class="ov" hidden><div class="sh" role="dialog" aria-modal="true" aria-labelledby="sht"><div class="shh"><h2 id="sht"></h2><button class="x" id="shx" aria-label="Close">×</button></div><div id="shb"></div></div></div>
<div id="toast" class="toast" hidden></div>
<script>{
const KEY='lambtracker.v1';
const blank=()=>({groups:[],products:[],log:[],deliv:[],set:{price:0,lead:7},updated:0});
let S=blank(),tab='flock';
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(blank(),JSON.parse(r))}catch(e){}
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const ms=s=>Date.parse(s+'T00:00:00Z');
const days=(a,b)=>Math.round((ms(b)-ms(a))/864e5);
const addD=(a,n)=>new Date(ms(a)+Math.round(n)*864e5).toISOString().slice(0,10);
const fmt=s=>s?new Date(ms(s)).toLocaleDateString('en-IE',{day:'numeric',month:'short',timeZone:'UTC'}):'—';
const rel=n=>n===0?'today':n===1?'tomorrow':n===-1?'yesterday':n>0?'in '+n+' days':(-n)+' days ago';
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const r1=n=>Math.round(n*10)/10;
const kg=n=>r1(n)+' kg';
const G=id=>S.groups.find(g=>g.id===id);
const P=id=>S.products.find(p=>p.id===id);

/* ---------- saving: on this phone ---------- */
function save(){S.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save. Is the phone storage full?')}render()}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});

/* ---------- maths ---------- */
const since=g=>g.weighed?Math.max(0,days(g.weighed,today())):0;
const est=g=>g.avg?g.avg+(g.dwg||0)*since(g):0;
const at=(g,d)=>g.avg?g.avg+(g.dwg||0)*Math.max(0,days(g.weighed||today(),d)):0;
const rangeAt=(g,d)=>{if(!g.min)return '';const k=(g.dwg||0)*Math.max(0,days(g.weighed||today(),d));return r1(g.min+k)+'–'+r1(g.max+k)+' kg'};
let predDate='';
const heavy=g=>{const t=g.max||g.avg;return t?t+(g.dwg||0)*since(g):0};
function nextW(g){if(!g.avg||!g.target)return null;if(g.avg>=g.target)return g.weighed||today();if(!g.dwg)return null;return addD(g.weighed||today(),Math.ceil((g.target-g.avg)/g.dwg))}
function lastOf(gid,type,pid){let b=null;for(const e of S.log)if(e.gid===gid&&e.type===type&&(!pid||e.pid===pid)&&(!b||e.date>=b.date))b=e;return b}
function recompute(g){const w=lastOf(g.id,'weigh');g.avg=w?w.avg:0;g.min=w&&w.min||0;g.max=w&&w.max||0;g.weighed=w?w.date:'';const b=lastOf(g.id,'bath');g.bath=b?b.date:''}
function doseMl(p,w){if(!(p.per>0))return p.rate||0;if(!w)return 0;return Math.ceil(w*p.rate/p.per*2)/2}
function withdrawal(g){let out=null;const t=today();for(const p of S.products){if(!(p.wd>0))continue;const l=lastOf(g.id,'dose',p.id);if(!l)continue;const e=addD(l.date,p.wd);if(e>=t&&(!out||e>out.end))out={end:e,name:p.name}}return out}
function addWeigh(g,date,lo,hi,count){const e={id:uid(),gid:g.id,type:'weigh',date,avg:r1((lo+hi)/2)};if(hi>lo){e.min=lo;e.max=hi}if(count)e.count=count;S.log.push(e);recompute(g)}
const money=n=>(n||0).toLocaleString('en-IE',{minimumFractionDigits:2,maximumFractionDigits:2});
const usage=()=>S.groups.reduce((a,g)=>a+(g.meal||0),0)/7;
function stockNow(){if(!S.set.stockDate)return null;return Math.max(0,(S.set.stockKg||0)-usage()*Math.max(0,days(S.set.stockDate,today())))}
function runOut(){const sn=stockNow(),u=usage();if(sn==null||!u)return null;return addD(today(),Math.floor(sn/u))}
function actualGain(g){const w=S.log.filter(e=>e.gid===g.id&&e.type==='weigh').sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
 for(let i=w.length-1;i>0;i--){const d=days(w[i-1].date,w[i].date);if(d>0)return{v:(w[i].avg-w[i-1].avg)/d,from:w[i-1].date,to:w[i].date}}return null}
function feedEff(g){if(!g.meal||!g.count)return null;const a=actualGain(g),v=a&&a.v>0?a.v:g.dwg;if(!(v>0))return null;
 const ph=g.meal/g.count/7,fcr=ph/v;return{v,actual:!!(a&&a.v>0),fcr,cost:S.set.price?fcr*S.set.price/1000:0}}
function dueList(){const t=today(),out=[];for(const g of S.groups){const nw=nextW(g);
 if(nw)out.push({d:nw,txt:'Weigh '+g.name,sub:g.avg>=g.target?'Average already at move-on weight':'Should be about '+g.target+' kg by then'});
 if(g.bath&&g.bathEvery>0)out.push({d:addD(g.bath,g.bathEvery),txt:'Footbath '+g.name,sub:'Last done '+fmt(g.bath)});
 for(const p of S.products){const l=lastOf(g.id,'dose',p.id);if(!l)continue;
  if(p.every>0)out.push({d:addD(l.date,p.every),txt:p.name+' · '+g.name,sub:'Last dosed '+fmt(l.date)});
  if(p.wd>0){const e=addD(l.date,p.wd);if(e>=t)out.push({d:e,txt:'Withdrawal ends · '+g.name,sub:p.name+': not for slaughter before this date',wd:1})}}}
 const ro=runOut();if(ro)out.push({d:addD(ro,-(S.set.lead||7)),txt:'Order meal',sub:'Bin runs out around '+fmt(ro)+' ('+Math.round(stockNow())+' kg left)'});
 return out.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0)}

/* ---------- views ---------- */
function stats(){const lambs=S.groups.reduce((a,g)=>a+(g.count||0),0),meal=S.groups.reduce((a,g)=>a+(g.meal||0),0),nx=dueList()[0],sn=stockNow(),u=usage(),yr=today().slice(0,4);
 const sold=S.log.filter(e=>e.type==='sale'&&e.date.startsWith(yr)).reduce((a,e)=>a+(e.n||0),0);
 const ml=sn!=null?[(sn>=1000?r1(sn/1000)+' t':Math.round(sn)+' kg'),'meal in bin'+(u?' · '+Math.floor(sn/u)+' days left':'')]:[meal>=1000?r1(meal/1000)+' t':meal+' kg','meal per week'];
 $('stats').innerHTML=[[lambs,'lambs on farm'],ml,[sold,'sold in '+yr],[nx?fmt(nx.d):'—',nx?'next: '+esc(nx.txt):'nothing due']].map(([b,t])=>`<div class="stat"><b>${b}</b><span>${t}</span></div>`).join('')}
const job=x=>{const n=days(today(),x.d);const late=n<0&&!x.wd;return `<li class="${late?'late':''}"><div class="when">${fmt(x.d)}<small>${late?'overdue':rel(n)}</small></div><div><b>${esc(x.txt)}</b><div class="sm mute">${esc(x.sub)}</div></div></li>`};
function card(g){const e=est(g),nw=nextW(g),t=today(),wd=withdrawal(g),ld=lastOf(g.id,'dose');
 const pct=g.target&&e?Math.min(100,e/g.target*100):0,ph=g.count&&g.meal?g.meal/g.count/7:0;
 const nb=g.bath&&g.bathEvery>0?addD(g.bath,g.bathEvery):'';
 return `<article class="g"><div class="gh"><span class="tag">${esc(g.name)}</span><span class="cnt">${g.count||0} lambs</span></div>
 <div class="wt"><div><b class="big">${e?r1(e):'—'}</b> <span>kg est. today</span></div>${g.target?`<div class="mute">Move on at <b>${g.target} kg</b></div>`:''}</div>
 ${g.min&&g.dwg?`<div class="sm mute" style="margin-top:-6px">Most lambs ~${rangeAt(g,t)} today</div>`:''}
 <div class="bar" title="${Math.round(pct)}% of move-on weight"><i style="width:${pct}%"></i></div>
 ${e&&g.dwg?`<div class="proj">${[7,14,28].map(n=>{const d=addD(t,n);return `<div><span>${n===28?'4 weeks':n/7+(n===7?' week':' weeks')}</span><b>${r1(at(g,d))} kg</b><span>${fmt(d)}</span></div>`}).join('')}</div>`:''}
 ${wd?`<div><span class="chip">In withdrawal until ${fmt(wd.end)}</span></div>`:''}
 <dl><dt>Last weighed</dt><dd>${g.weighed?fmt(g.weighed)+' · '+(g.min?g.min+'–'+g.max+' kg':kg(g.avg)):'Not yet'}</dd>
 <dt>Daily gain</dt><dd>${g.dwg?Math.round(g.dwg*1000)+' g/day predicted':'Not set'}</dd>
 <dt>Next weigh</dt><dd class="${nw&&nw<=t?'due':''}">${nw?fmt(nw)+' ('+rel(days(t,nw))+')':'Needs weight, gain and target'}</dd>
 <dt>Meal</dt><dd>${g.meal?g.meal+' kg/wk · '+ph.toFixed(2)+' kg/head/day':'Not set'}</dd>${(fe=>fe?`<dt>Meal per kg gain</dt><dd>${r1(fe.fcr)} kg${fe.cost?' · €'+money(fe.cost):''}${fe.actual?'':' (predicted)'}</dd>`:'')(feedEff(g))}
 <dt>Last dose</dt><dd>${ld?esc(ld.pname)+' · '+fmt(ld.date):'None recorded'}</dd>
 <dt>Footbath</dt><dd class="${nb&&nb<=t?'due':''}">${g.bath?fmt(g.bath)+(nb?' · next '+fmt(nb):''):'None recorded'}</dd></dl>
 <div class="acts"><button class="btn y" data-a="weigh" data-id="${g.id}">Weigh</button><button class="btn" data-a="dose" data-id="${g.id}">Dose</button><button class="btn" data-a="bath" data-id="${g.id}">Footbath</button><button class="btn" data-a="more" data-id="${g.id}">More</button></div></article>`}

  koL=L.filter(e=>e.cw&&e.lw),koN=koL.reduce((a,e)=>a+e.n,0),ko=koN?koL.reduce((a,e)=>a+e.cw/e.lw*e.n,0)/koN*100:0;

$('shx').onclick=close;$('ov').addEventListener('click',e=>{if(e.target.id==='ov')close()});

function arm(btn,label,fn){if(!btn)return;const orig=btn.textContent;btn.onclick=()=>{if(btn.dataset.arm){fn()}else{btn.dataset.arm=1;btn.textContent=label;setTimeout(()=>{delete btn.dataset.arm;btn.textContent=orig},4000)}}}

function line(e){switch(e.type){

function forecast(g){if(!g.avg||!g.dwg)return '<p class="sm mute">Weigh the group and set a predicted daily gain to see a forecast.</p>';
 const t=today(),rows=[];let hit=false;
 for(let w=0;w<=16;w++){const d=addD(t,w*7),kgs=at(g,d),h=!hit&&g.target&&kgs>=g.target;if(h)hit=true;
  rows.push(`<tr class="${h?'hit':''}"><td>${w?fmt(d):'Today'}</td><td class="n">${r1(kgs)} kg</td><td class="n">${rangeAt(g,d)||'—'}</td></tr>`);if(hit||(!g.target&&w>=8))break}
 return `<h3 style="margin:18px 0 4px">Predicted weights</h3><p class="sm mute" style="margin:0 0 6px">At ${Math.round(g.dwg*1000)} g/day from ${fmt(g.weighed)}${g.target?` · move on at ${g.target} kg`:''}</p>

/* factory docket reader (runs on the phone, same reader as the Gym app) */
let ocrW=null,ocrLoading=null;
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function getOCR(msg){if(ocrW)return ocrW;if(ocrLoading)return ocrLoading;
 ocrLoading=(async()=>{const abs=u=>new URL(u,location.href).href;if(!window.Tesseract)await loadScript(abs('../ocr/tesseract.min.js'));
  ocrW=await Tesseract.createWorker('eng',1,{workerPath:abs('../ocr/worker.min.js'),corePath:abs('../ocr/core'),langPath:abs('../ocr/lang'),
   logger:m=>{if(msg&&m&&m.status)msg(m.status.indexOf('recogniz')>=0?'Reading the docket… '+Math.round((m.progress||0)*100)+'%':'Getting the docket reader ready (first time only)…')}});
  await ocrW.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});return ocrW})();
 try{return await ocrLoading}finally{ocrLoading=null}}
async function prepImage(file){const url=URL.createObjectURL(file);try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
 const sc=Math.min(2.5,2200/Math.max(img.naturalWidth,img.naturalHeight)),cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*sc);cv.height=Math.round(img.naturalHeight*sc);
 const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0,cv.width,cv.height);const d=cx.getImageData(0,0,cv.width,cv.height),a=d.data;let lo=255,hi=0;
 for(let i=0;i<a.length;i+=4){const v=a[i]*.3+a[i+1]*.59+a[i+2]*.11;a[i]=v;if(v<lo)lo=v;if(v>hi)hi=v}
 const k=255/Math.max(40,hi-lo);for(let i=0;i<a.length;i+=4){const v=Math.max(0,Math.min(255,(a[i]-lo)*k));a[i]=a[i+1]=a[i+2]=v}
 cx.putImageData(d,0,0);return cv}finally{URL.revokeObjectURL(url)}}
function parseDocket(raw){
 const t=raw.replace(/[|\[\]{}]/g,' ').replace(/(\d)\s*[·:;]\s*(\d)/g,'$1.$2').replace(/(\d)\s*,\s*(\d{2})(?!\d)/g,'$1.$2');
 const lines=t.split(/\n/).map(l=>l.trim()).filter(Boolean),out={},rows=[],grades={};
 const moneyIn=l=>[...l.matchAll(/\d{1,3}(?:,\d{3})+\.\d{2}|\d+\.\d{2}/g)].map(m=>+m[0].replace(/,/g,''));
 const lineMax=re=>{let v=0;for(const l of lines)if(re.test(l)){const m=Math.max(0,...moneyIn(l));if(m>v)v=m}return v};
 for(const l of lines){const nums=[...l.matchAll(/\d+\.\d{1,2}/g)].map(m=>+m[0]),gm=l.match(/(?:^|\s)([EUROP])\s?([1-5])(?=\s|$)/i);
  let row=null;
  for(const w of nums){if(w<8||w>45)continue;for(const pr of nums){if(pr===w||pr<2.5||pr>15)continue;
   if(nums.some(v=>v>30&&Math.abs(w*pr-v)<=Math.max(1,v*.02))||gm){row={w,p:pr};break}}if(row)break}
  if(row){rows.push(row);if(gm){const g=(gm[1]+gm[2]).toUpperCase();grades[g]=(grades[g]||0)+1}}}
 const hd=t.match(/(?:no\.?|number|qty|total)\s*(?:of\s*)?(?:lambs|head|animals|hd)\D{0,6}(\d{1,3})\b/i)||t.match(/\b(\d{1,3})\s*(?:lambs|head|hd)\b/i);
 out.n=hd&&+hd[1]>0?+hd[1]:rows.length||undefined;
 const tw=t.match(/total\s*(?:cold\s*|carcass\s*)?(?:weight|wt|kgs?)\D{0,8}(\d+(?:\.\d+)?)/i),totW=tw?+tw[1]:0;
 if(out.n&&totW&&totW/out.n>=8&&totW/out.n<=45)out.cw=r1(totW/out.n);else if(rows.length)out.cw=r1(rows.reduce((a,r)=>a+r.w,0)/rows.length);
 const gross=lineMax(/gross|total\s*value/i),rw=rows.reduce((a,r)=>a+r.w,0);
 if(gross&&totW&&gross/totW>=2.5&&gross/totW<=15)out.ppk=Math.round(gross/totW*100)/100;
 else if(rw)out.ppk=Math.round(rows.reduce((a,r)=>a+r.w*r.p,0)/rw*100)/100;
 else{const pk=t.match(/(\d{1,2}\.\d{2})\s*(?:€|eur|euro|c)?\s*(?:\/|per)\s*kg/i)||t.match(/price\D{0,10}(\d{1,2}\.\d{2})/i);if(pk&&+pk[1]>=2.5&&+pk[1]<=15)out.ppk=+pk[1]}
 const g=Object.keys(grades).sort((a,b)=>grades[b]-grades[a]);if(g.length)out.grade=g[0];
 const net=lineMax(/net|payable|amount\s*due|amount\s*paid|total\s*paid|to\s*pay|cheque|transfer/i);if(net>=20)out.net=net;
 const dm=t.match(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](20\d{2}|\d{2})\b/);
 if(dm){const y=dm[3].length===2?'20'+dm[3]:dm[3],mo=+dm[2],da=+dm[1];if(mo>=1&&mo<=12&&da>=1&&da<=31){const d=`${y}-${pad(mo)}-${pad(da)}`;if(d<=today())out.date=d}}
 return out}
async function readDocket(file,f,upd){const msg=t=>{const e=$('dkm');if(e)e.textContent=t};msg('Getting the docket reader ready (first time only)…');
 try{const w=await getOCR(msg);msg('Reading the docket…');const cv=await prepImage(file);const r=await w.recognize(cv);if(!$('dkm'))return;
  const v=parseDocket(r.data.text||''),names={n:'number of lambs',cw:'carcass weight',ppk:'price per kg',grade:'grade',net:'net paid',date:'date'},got=[];
  for(const k of Object.keys(names))if(v[k]!=null&&v[k]!==''){f[k].value=v[k];f[k].classList.add('filled');got.push(names[k])}
  if(got.length){f.to.value='Factory';upd()}
  const miss=['n','cw','ppk','net'].filter(k=>v[k]==null).map(k=>names[k]);
  msg(got.length?`Filled in ${got.join(', ')}. Check them against the docket.${miss.length?' Couldn\'t read '+miss.join(', ')+', so type '+(miss.length>1?'those':'that')+' in.':''}`
   :'Couldn\'t read the figures. Try again with the docket flat, well lit and filling the photo, or type them in.')}
 catch(e){msg('The docket reader couldn\'t start. The first time, it needs a signal to download. Or type the figures in.')}}
function example(){const t=today(),a=uid(),b=uid(),c=uid(),p1=uid(),p2=uid();
 S.products=[{id:p1,name:'White drench (example)',kind:'Wormer',rate:2.5,per:10,wd:3,every:28,notes:''},{id:p2,name:'Cobalt + selenium (example)',kind:'Mineral / vitamin',rate:5,per:0,wd:0,every:42,notes:''}];
 S.groups=[{id:a,name:'30–35 kg',count:46,target:35,dwg:.22,meal:110,bathEvery:28},{id:b,name:'35–40 kg',count:38,target:40,dwg:.25,meal:150,bathEvery:28},{id:c,name:'40–45 kg',count:30,target:45,dwg:.28,meal:190,bathEvery:28}];
 S.log=[];addWeigh(S.groups[0],addD(t,-10),30,34);addWeigh(S.groups[1],addD(t,-14),36,40);addWeigh(S.groups[2],addD(t,-9),40,45);
 S.groups.forEach((g,i)=>{S.log.push({id:uid(),gid:g.id,type:'dose',date:addD(t,-20-i*3),pid:p1,pname:S.products[0].name,ml:doseMl(S.products[0],heavy(g)),note:''},{id:uid(),gid:g.id,type:'bath',date:addD(t,-25+i*4),sol:'Zinc sulphate 10%'});recompute(g)});
 save();toast('Example groups added. Delete them when you add your own.')}
