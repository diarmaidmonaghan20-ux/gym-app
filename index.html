<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Logbook">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0c0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Logbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Dark gym theme: graphite ground, fiery orange-red accent, bold condensed numbers. */
:root{color-scheme:dark;--bg:#0b0c0f;--card:#15171c;--card2:#1a1d23;--soft:#1f232a;--line:#272b33;--ink:#f3f1ec;--mute:#8d929e;
 --red:#ff4d2e;--blue:#3da5ff;--yellow:#ffb020;--green:#2fd27a;--hot:linear-gradient(135deg,#ff8a2e 0%,#ff2e4d 100%);--glow:0 8px 24px -8px rgba(255,77,46,.55)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(120% 60% at 100% -10%,rgba(255,77,46,.16),transparent 60%),radial-gradient(90% 50% at -10% 0%,rgba(61,165,255,.08),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(92px + env(safe-area-inset-bottom));min-height:100vh}
h1,h2,h3,.num{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;line-height:1.05;margin:0;letter-spacing:.01em}
h1{font-size:34px}h2{font-size:26px}h3{font-size:21px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header.top{padding:calc(env(safe-area-inset-top) + 14px) 0 6px}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font-size:36px;font-weight:700;font-style:italic;text-transform:uppercase;letter-spacing:.02em;background:var(--hot);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:4px}
.icon-btn{background:var(--card);border:1px solid var(--line);color:var(--ink);width:44px;height:44px;display:grid;place-items:center;border-radius:14px;cursor:pointer}
.icon-btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,.btn:focus-within{outline:2px solid var(--red);outline-offset:2px}
.datebar{position:sticky;top:0;z-index:5;background:rgba(11,12,15,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.05)}
.datebar .wrap{display:flex;align-items:center;gap:8px;padding-block:8px}
.datebar .d{flex:1;text-align:center;font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 15px Barlow,system-ui,sans-serif;min-height:40px;cursor:pointer;transition:transform .12s,background .12s}
.chip:active,.btn:active{transform:scale(.97)}
.chip[data-r]{border-color:rgba(255,77,46,.45);background:rgba(255,77,46,.10)}
.view{padding-top:16px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 12px 30px -18px rgba(0,0,0,.8)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select{font:16px Barlow,system-ui,sans-serif;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:46px;width:100%;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
label.f{display:block;font-size:13px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
label.f input,label.f select{margin-top:5px;text-transform:none;letter-spacing:0;font-weight:400}
.btn,button.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:600 16px Barlow,system-ui,sans-serif;cursor:pointer;text-align:center;transition:transform .12s}
.btn.primary{background:var(--hot);border-color:transparent;color:#fff;box-shadow:var(--glow);font-weight:700}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#0b0c0f;font-weight:700}
.btn.block{width:100%}
.mute{color:var(--mute)}.small{font-size:14px}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:4px 0 14px}
.summary div{display:flex;flex-direction:column;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.summary .num{font-size:clamp(30px,9vw,40px)}
.summary div:first-child .num{background:var(--hot);-webkit-background-clip:text;background-clip:text;color:transparent}
.summary span:last-child{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-head h3{font-size:23px}
.x{background:none;border:0;color:var(--mute);width:40px;height:40px;border-radius:12px;font-size:22px;cursor:pointer;flex:none}
.sets{width:100%;border-collapse:separate;border-spacing:0 6px;margin:8px 0;font-variant-numeric:tabular-nums}
.sets td{padding:8px 6px;background:var(--soft)}
.sets td:first-child{border-radius:12px 0 0 12px}.sets td:last-child{border-radius:0 12px 12px 0}
.sets td.n{width:2.6em;text-align:center}
.sets td.n{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;color:var(--red);font-size:18px}
.sets td.v{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:22px}
.sets td.r{text-align:right;width:44px}
.addset{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.plate{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tot{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ring{position:relative;width:148px;height:148px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .num{font-size:36px}.ring small{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
@media(max-width:360px){.tot{grid-template-columns:1fr;justify-items:center}}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;border-radius:6px;box-shadow:0 0 12px currentColor}
.macros{display:grid;gap:4px}
.macros .num{font-size:22px}
.entry{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .t{flex:1}.entry .t b{display:block;font-weight:600}
.entry .k{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:21px;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips .chip{flex:none;white-space:nowrap;max-width:75vw;overflow:hidden;text-overflow:ellipsis}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.actions .btn{padding:10px 6px;font-size:15px}
.fig{position:relative;height:240px;margin:8px 0}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
svg text{font:12px Barlow,system-ui,sans-serif;fill:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stats div{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.stats .num{font-size:30px}.stats span{display:block;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-top:2px}
table.hist{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.hist th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:6px 4px;text-transform:uppercase;letter-spacing:.04em}
table.hist td{padding:9px 4px;border-top:1px solid var(--line);white-space:nowrap}
table.hist td.r,table.hist th.r{text-align:right}
.empty{text-align:center;padding:28px 8px;color:var(--mute)}
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;background:rgba(21,23,28,.82);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.07);border-radius:24px;display:grid;grid-template-columns:repeat(4,1fr);z-index:10;box-shadow:0 18px 40px -12px rgba(0,0,0,.9);padding:4px}
nav.tabs button{position:relative;background:none;border:0;color:var(--mute);font:600 12px Barlow,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;cursor:pointer;border-radius:20px;transition:color .15s,background .15s}
nav.tabs button[aria-selected=true]{color:#fff;background:rgba(255,77,46,.16)}
nav.tabs button[aria-selected=true] svg{stroke:var(--red);filter:drop-shadow(0 0 6px rgba(255,77,46,.7))}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-card{position:relative;background:var(--card);border:1px solid var(--line);border-bottom:0;width:100%;max-width:640px;border-radius:26px 26px 0 0;padding:26px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet-card::before{content:"";position:absolute;top:9px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--line)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet-card{animation:none}.chip,.btn{transition:none}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
.preview{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;font-variant-numeric:tabular-nums}
.preview .num{background:var(--hot);-webkit-background-clip:text;background-clip:text;color:transparent}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#f3f1ec;color:#0b0c0f;font-weight:600;padding:11px 16px;border-radius:16px;display:flex;gap:14px;align-items:center;z-index:30;max-width:92vw;box-shadow:0 14px 30px -10px rgba(0,0,0,.8)}
.toast[hidden]{display:none}.toast button{background:none;border:0;color:#e0361b;font:700 15px Barlow,system-ui,sans-serif;cursor:pointer;min-height:32px}
.note{font-size:14px;background:rgba(255,176,32,.08);border:1px solid rgba(255,176,32,.25);padding:10px 12px;border-radius:14px;margin:8px 0}
textarea{width:100%;min-height:120px;font:13px ui-monospace,monospace;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px}
[hidden]{display:none!important}
.cam{position:relative;aspect-ratio:3/4;max-height:58vh;margin:12px auto;background:#000;border-radius:20px;overflow:hidden}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .aim{position:absolute;left:10%;right:10%;top:36%;height:28%;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.45)}
.cam .aim::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:3px;border-radius:2px;background:var(--red);box-shadow:0 0 12px var(--red);animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(40px)}}
@media (prefers-reduced-motion:reduce){.cam .aim::after{animation:none}}
.src{font-size:11px;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.meal-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}.meal-head h3{text-transform:uppercase;letter-spacing:.03em}
.meal-head .k{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:21px;white-space:nowrap;color:var(--red)}
.meal-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.meal-acts .btn{flex:1 1 130px;font-size:15px;padding:8px 10px}
.meal-acts [data-copy]{border-color:rgba(255,77,46,.4);color:#ffb39f}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rlist{list-style:none;padding:0;margin:10px 0}.rlist li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.rlist li span{flex:1}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
</style>
</head>
<body>
<header class="top"><div class="wrap"><h1>Logbook</h1><button class="icon-btn" id="setBtn" aria-label="Settings and goals"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button></div></header>

<div class="datebar" id="datebar"><div class="wrap">
 <button class="chip" id="prevD" aria-label="Previous day">‹</button>
 <div class="d" id="dLabel"></div>
 <button class="chip" id="todayD">Today</button>
 <button class="chip" id="nextD" aria-label="Next day">›</button>
</div></div>

<main class="wrap">
<section class="view" id="v-train">
 <div class="summary" id="trainSum"></div>
 <div class="card">
  <label class="f">Add an exercise<select id="exSel"></select></label>
  <div class="row" id="customRow" hidden style="margin-top:8px"><input id="exName" placeholder="Name your exercise" autocomplete="off" style="flex:1 1 200px"><button class="btn primary" id="addEx">Add</button></div>
  <p class="small mute" style="margin:14px 0 6px">Routines</p><div class="chips" id="routines" style="flex-wrap:wrap"></div>
 </div>
 <div id="trainList"></div>
</section>

<section class="view" id="v-food" hidden>
 <div class="card" id="totals"></div>
 <div class="actions">
  <button class="btn primary" id="scanBtn">Scan</button>
  <input type="file" accept="image/*" capture="environment" id="scanIn" hidden>
  <button class="btn" id="myFoodsBtn">Search</button>
  <button class="btn" id="newFoodBtn">New food</button>
 </div>
 <div id="recent"></div>
 <div id="foodList"></div>
</section>

<section class="view" id="v-prog" hidden>
 <div class="card">
  <label class="f">Exercise<select id="progEx"></select></label>
  <div class="fig" id="progFig"><svg id="progSvg"></svg></div>
  <p class="small mute" style="margin:0"><span class="plate" style="background:var(--red)"></span>Heaviest set &nbsp; <span class="plate" style="background:var(--blue)"></span>Estimated 1-rep max</p>
 </div>
 <div class="stats" id="progStats" style="margin-bottom:14px"></div>
 <div class="card"><h3>History</h3><div id="progHist"></div></div>
</section>

<section class="view" id="v-weight" hidden>
 <div class="card">
  <div class="addset" style="grid-template-columns:minmax(0,1fr) auto">
   <label class="f">Body weight (kg) for this day<input id="bwIn" type="number" inputmode="decimal" step="0.1" placeholder="e.g. 82.4"></label>
   <button class="btn primary" id="bwSave">Save</button>
  </div>
 </div>
 <div class="stats" id="bwStats" style="margin-bottom:14px"></div>
 <div class="card"><h3>Trend</h3><div class="fig"><svg id="bwSvg"></svg></div></div>
 <div class="card"><h3>Entries</h3><div id="bwList"></div></div>
</section>
</main>

<nav class="tabs" role="tablist">
 <button role="tab" data-v="train" aria-selected="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>Train</button>
 <button role="tab" data-v="prog" aria-selected="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 19l6-6 4 4 8-9"/><path d="M15 8h6v6"/></svg>Progress</button>
 <button role="tab" data-v="food" aria-selected="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7v4M7 7v14M10 7v4a3 3 0 0 1-6 0M17 21V3c-2 1-3 4-3 8h3"/></svg>Food</button>
 <button role="tab" data-v="weight" aria-selected="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M9 9l3 3 3-3"/></svg>Weight</button>
</nav>

<div class="sheet" id="sheet" hidden><div class="sheet-card" id="sheetBody" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastUndo" hidden>Undo</button></div>

<script src="zxing.min.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=n=>Math.round(n*10)/10, r0=n=>Math.round(n);
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const shift=(ds,k)=>{const d=new Date(ds+'T12:00');d.setDate(d.getDate()+k);return iso(d)};
const fmt=(ds,o)=>new Date(ds+'T12:00').toLocaleDateString('en-IE',o||{weekday:'short',day:'numeric',month:'short'});
const GROUPS={Chest:['Bench press','Incline bench press','Decline bench press','Dumbbell bench press','Incline dumbbell press','Chest fly','Cable crossover','Pec deck','Push-up','Dips'],
 Back:['Deadlift','Barbell row','Dumbbell row','Pull-up','Chin-up','Lat pulldown','Seated cable row','T-bar row','Face pull','Shrugs'],
 Legs:['Squat','Front squat','Hack squat','Goblet squat','Leg press','Romanian deadlift','Lunges','Bulgarian split squat','Leg extension','Leg curl','Hip thrust','Calf raise'],
 Shoulders:['Overhead press','Dumbbell shoulder press','Arnold press','Lateral raise','Front raise','Rear delt fly','Upright row'],
 Arms:['Barbell curl','Dumbbell curl','Hammer curl','Preacher curl','Cable curl','Tricep pushdown','Skull crusher','Overhead tricep extension','Close-grip bench press'],
 Core:['Cable crunch','Hanging leg raise','Ab wheel rollout','Russian twist','Sit-up']};
const PRESET=Object.values(GROUPS).flat();
const BW=new Set(['Push-up','Dips','Pull-up','Chin-up','Hanging leg raise','Ab wheel rollout','Sit-up','Lunges']);
const KGS=[0,...Array.from({length:20},(_,i)=>i+1),...Array.from({length:112},(_,i)=>22.5+i*2.5)];
const kgOpts=v=>{const l=KGS.includes(v)?KGS:[...KGS,v].sort((a,b)=>a-b);return l.map(k=>`<option value="${k}"${k===v?' selected':''}>${k===0?'Bodyweight':k+' kg'}</option>`).join('')};
const repOpts=v=>Array.from({length:30},(_,i)=>i+1).concat(v>30?[v]:[]).map(r=>`<option value="${r}"${r===v?' selected':''}>${r} rep${r>1?'s':''}</option>`).join('');
const LS='logbook-v1';
const S={profile:{goals:{kcal:2500,p:150,c:250,f:80},foods:{},ex:[]},days:{}};
let cur=today(), view='train', mode='local', col=null, lastSnap='';

/* ---------- storage ---------- */
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j){Object.assign(S.profile,j.profile||{});S.days=j.days||{}}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const day=ds=>{const d=S.days[ds]||(S.days[ds]={});d.w=d.w||[];d.f=d.f||[];return d};
const isEmpty=d=>!d||(!(d.w||[]).length&&!(d.f||[]).length&&d.bw==null);
const Q={};
function persist(id){saveLocal();if(mode!=='db')return;const q=Q[id]||(Q[id]={busy:false,dirty:false});q.dirty=true;if(!q.busy)flush(id)}
async function flush(id){const q=Q[id];q.busy=true;while(q.dirty){q.dirty=false;const body=id==='profile'?S.profile:S.days[id.slice(2)];
 try{if(id!=='profile'&&isEmpty(body))await col.doc(id).delete();else await col.doc(id).set(JSON.parse(JSON.stringify(body)))}
 catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));q.dirty=true}else{toast(e&&e.code==='quota_exceeded'?'Storage is full: delete some old entries':'Could not save to your account, kept on this device');}}}

async function initDb(){
 if(!window.claude||!window.claude.use){return}
 let db=null,user=null;
 try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}
 const uid=user?await user.id().catch(()=>null):null;
 if(!db||!uid)return;
 col=db.collection('data/users/'+uid);mode='db';
 const t=setTimeout(()=>toast('Can\'t reach your saved data yet, showing this device\'s copy'),10000);
 col.onSnapshot(snap=>{
  if(snap.metadata.hasPendingWrites)return;
  if(!snap.metadata.fromCache)clearTimeout(t);
  let prof=null;const days={};
  snap.docs.forEach(d=>{if(d.id==='profile')prof=d.data();else if(d.id.startsWith('d-'))days[d.id.slice(2)]=d.data()});
  const key=JSON.stringify({prof,days});if(key===lastSnap)return;lastSnap=key;
  const local=JSON.stringify({p:S.profile,d:S.days});
  if(!prof&&!Object.keys(days).length&&Object.keys(S.days).length&&!snap.metadata.fromCache){
   // first run with an account: move what's on this device up
   saveProfile();Object.keys(S.days).forEach(saveDay);return}
  if(prof)S.profile=Object.assign({goals:{kcal:2500,p:150,c:250,f:80},foods:{},ex:[]},JSON.parse(JSON.stringify(prof)));
  S.days=JSON.parse(JSON.stringify(days));
  if(JSON.stringify({p:S.profile,d:S.days})!==local){saveLocal();renderAll()}
 },e=>{clearTimeout(t);mode='local';toast('Saving on this device only')});
}

function chart(svg,pts,unit,two){
 const W=svg.clientWidth,H=svg.clientHeight;if(!W||!H)return;
 if(!pts.length){svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle">Nothing to chart yet</text>`;return}
 const L=44,R=14,T=14,B=26,t=p=>new Date(p.d+'T12:00').getTime();
 let x0=t(pts[0]),x1=t(pts[pts.length-1]);if(x0===x1){x0-=864e5*3;x1+=864e5*3}
 const ys=pts.flatMap(p=>two?[p.y,p.y2]:[p.y]);let y0=Math.min(...ys),y1=Math.max(...ys);const pd=Math.max((y1-y0)*.12,1);y0-=pd;y1+=pd;
 const X=v=>L+(v-x0)/(x1-x0)*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
 const gid='ag'+svg.id;let g=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4d2e" stop-opacity=".38"/><stop offset="1" stop-color="#ff4d2e" stop-opacity="0"/></linearGradient></defs>`;for(let k=0;k<=3;k++){const v=y0+(y1-y0)*k/3;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#23272e" stroke-dasharray="3 5"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${r0(v)}</text>`}
 const fo=W<520?{day:'numeric',month:'short'}:{day:'numeric',month:'short',year:'2-digit'};
 g+=`<text x="${L}" y="${H-6}">${esc(fmt(pts[0].d,fo))}</text>`;if(pts.length>1)g+=`<text x="${W-R}" y="${H-6}" text-anchor="end">${esc(fmt(pts[pts.length-1].d,fo))}</text>`;
 const line=(k,c,dash)=>`<polyline fill="none" stroke="${c}" stroke-width="${dash?2:3}" stroke-linejoin="round" stroke-linecap="round" ${dash?'stroke-dasharray="5 5" opacity=".85"':'style="filter:drop-shadow(0 0 6px rgba(255,77,46,.7))"'} points="${pts.map(p=>X(t(p))+','+Y(p[k])).join(' ')}"/>`+pts.map(p=>`<circle cx="${X(t(p))}" cy="${Y(p[k])}" r="${pts.length>40?2:4}" fill="${c}" stroke="#15171c" stroke-width="2"/>`).join('');
 if(pts.length>1)g+=`<path d="M${X(t(pts[0]))},${H-B} ${pts.map(p=>'L'+X(t(p))+','+Y(p.y)).join(' ')} L${X(t(pts[pts.length-1]))},${H-B}Z" fill="url(#${gid})"/>`;
 if(two)g+=line('y2','var(--blue)',1);g+=line('y','var(--red)');
 const lp=pts[pts.length-1];g+=`<text x="${Math.min(X(t(lp)),W-R)}" y="${Math.max(Y(lp.y)-10,12)}" text-anchor="end" style="fill:var(--ink);font-weight:600">${esc(lp.y)} ${unit}</text>`;
 svg.innerHTML=g;
}

  ocrW=await Tesseract.createWorker('eng',1,{workerPath:abs('ocr/worker.min.js'),corePath:abs('ocr/core'),langPath:abs('ocr/lang'),
   logger:m=>{if(msg&&m&&m.status)msg(m.status.indexOf('recogniz')>=0?'Reading the numbers… '+Math.round((m.progress||0)*100)+'%':'Getting the label reader ready (first time only)…')}});
  await ocrW.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});return ocrW})();

 const sc=Math.min(2.5,2000/Math.max(img.naturalWidth,img.naturalHeight)),cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*sc);cv.height=Math.round(img.naturalHeight*sc);

 for(let i=0;i<a.length;i+=4){const g=a[i]*.3+a[i+1]*.59+a[i+2]*.11;a[i]=g;if(g<lo)lo=g;if(g>hi)hi=g}
 const k=255/Math.max(40,hi-lo);for(let i=0;i<a.length;i+=4){const g=Math.max(0,Math.min(255,(a[i]-lo)*k));a[i]=a[i+1]=a[i+2]=g}

function parseLabel(raw){
 const t=raw.toLowerCase().replace(/[|\[\]{}]/g,' ').replace(/(\d)\s*[,·]\s*(\d)/g,'$1.$2').replace(/(\d)o/g,'$10').replace(/o(\d)/g,'0$1').replace(/(\d)\s+\.(\d)/g,'$1.$2');
 const lines=t.split(/\n/).map(l=>l.trim()).filter(Boolean),out={};
 const first=(l,max)=>{const m=[...l.matchAll(/(\d+(?:\.\d+)?)\s*(g|kcal|kj)?/g)].map(x=>+x[1]).filter(v=>v<=max);return m.length?m[0]:null};
 let k=t.match(/(\d+(?:\.\d+)?)\s*k\s*c\s*a\s*l/);
 if(k&&+k[1]<=900&&+k[1]>0)out.kcal=+k[1];
 else{const h=t.match(/kj\s*\/\s*kcal[^\d]*(\d{2,4}(?:\.\d+)?)\s*\/\s*(\d{1,3}(?:\.\d+)?)/),m=t.match(/(\d{2,4}(?:\.\d+)?)\s*kj\s*\/\s*(\d{1,3}(?:\.\d+)?)\b/);
  if(h&&+h[2]<=900)out.kcal=+h[2];else if(m&&+m[2]<=900)out.kcal=+m[2];else{const j=t.match(/(\d{2,4}(?:\.\d+)?)\s*kj/);if(j&&+j[1]<=3800)out.kcal=r0(+j[1]/4.184)}}

 const f=pick(/\bfat\b|^fat/,/satur|of which|mono|poly/),c=pick(/carbo\w*/,/of which|sugar/),p=pick(/prote\w*/);

async function readLabel(file){const msg=t=>{const e=$('lblMsg');if(e)e.textContent=t};

  if(!$('lblMsg'))return;const v=parseLabel(r.data.text||'');const map={kcal:'fK',p:'fP',c:'fC',f:'fF'},names={kcal:'calories',p:'protein',c:'carbs',f:'fat'};

 const on=await lookupOnline(code);
 if(on&&on.kcal!=null){S.profile.foods[code]={name:on.name||('Product '+code),brand:on.brand||'',code,kcal:on.kcal,p:on.p??0,c:on.c??0,f:on.f??0,lastG:100,src:'OFF'};saveProfile();foodSheet(code);return}
 foodForm({code},on?'Found online but without calorie info. Tap Read nutrition label from photo to fill it in. It\'s remembered next time.':'Not found in Open Food Facts. Tap Read nutrition label from photo and snap the nutrition table on the pack. It\'s remembered next time you scan it.');
}
let live=null;
function stopScan(){if(live){try{live.reset()}catch(e){}live=null}const v=$('cam');if(v&&v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}}
async function liveScan(){
 if(!window.ZXing||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('scanIn').click();return}
 openSheet(`<h2>Scan barcode</h2><div class="cam"><video id="cam" playsinline muted></video><div class="aim"></div></div>
  <p class="small mute" id="camMsg" style="text-align:center;margin:0 0 10px">Line the barcode up inside the box.</p>
  <div class="row" style="margin-bottom:10px"><input id="codeIn" inputmode="numeric" placeholder="Or type the barcode number" style="flex:1 1 160px"><button class="btn dark" id="codeGo">Look up</button></div>
  <div class="grid2"><button class="btn" id="usePhoto">Use a photo</button><button class="btn" data-close>Cancel</button></div>`);
 $('codeGo').onclick=()=>{const c=$('codeIn').value;stopScan();handleCode(c)};
 $('usePhoto').onclick=()=>{stopScan();$('scanIn').click()};
 const rd=zx(),Z=window.ZXing,me={stop:false,reset(){this.stop=true}};live=me;
 let stream;
 try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}})}
 catch(e){if(live!==me)return;live=null;const m=$('camMsg');if(m)m.textContent=e&&e.name==='NotAllowedError'?'Camera access is off. Allow it in iPhone Settings, Safari, Camera, or use a photo instead.':'Couldn\'t start the camera. Use a photo or type the number instead.';return}
 const v=$('cam');if(live!==me||!v){stream.getTracks().forEach(t=>t.stop());return}
 v.srcObject=stream;try{await v.play()}catch(e){}
 const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let n=0;
 const tick=()=>{if(me.stop||live!==me)return;
  if(v.videoWidth){n++;const W=v.videoWidth,H=v.videoHeight;
   // alternate between the middle band (fast, where the box is) and the whole frame
   const full=n%3===0,sx=full?0:W*.05,sy=full?0:H*.25,sw=full?W:W*.9,sh=full?H:H*.5,sc=Math.min(1,1000/sw);
   cv.width=Math.round(sw*sc);cv.height=Math.round(sh*sc);cx.drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
   try{const res=rd.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv))));
    if(res&&!me.stop){if(navigator.vibrate)navigator.vibrate(40);stopScan();handleCode(res.getText());return}}catch(e){}}
  setTimeout(tick,120)};
 tick();
}
$('scanBtn').onclick=()=>{meal=null;liveScan()};
$('scanIn').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;
 openSheet(`<h2>Reading barcode…</h2><p class="mute">Hold tight.</p>`);
 let code=null;try{code=await decodeImage(file)}catch(err){}
 if(code){handleCode(code);return}
 openSheet(`<h2>Couldn't read a barcode</h2><p class="mute">Try again closer, flat and in good light, or type the numbers under the barcode.</p>
  <label class="btn primary block">Take another photo<input type="file" accept="image/*" capture="environment" id="scan2" hidden></label>
  <div class="row" style="margin-top:12px"><input id="codeIn" inputmode="numeric" placeholder="Barcode number" style="flex:1 1 160px"><button class="btn dark" id="codeGo">Look up</button></div>
  <button class="btn block" data-close style="margin-top:10px">Cancel</button>`);
 $('scan2').onchange=$('scanIn').onchange;$('codeGo').onclick=()=>handleCode($('codeIn').value);
};

/* ---------- settings ---------- */
$('setBtn').onclick=()=>{const g=G();
 openSheet(`<h2>Daily goals</h2><div class="grid2"><label class="f">Calories (kcal)<input id="gk" type="number" inputmode="numeric" value="${esc(g.kcal)}"></label><label class="f">Protein (g)<input id="gp" type="number" inputmode="numeric" value="${esc(g.p)}"></label><label class="f">Carbs (g)<input id="gc" type="number" inputmode="numeric" value="${esc(g.c)}"></label><label class="f">Fat (g)<input id="gf" type="number" inputmode="numeric" value="${esc(g.f)}"></label></div>
 <button class="btn primary block" id="gSave">Save goals</button>
 <h3 style="margin-top:22px">USDA key (optional)</h3><p class="small mute">Basic-food search uses USDA's shared demo key, which allows about 30 searches an hour. For more, get a free personal key at api.data.gov/signup and paste it here.</p>
 <div class="row"><input id="uKey" placeholder="Paste USDA API key" value="${esc(S.profile.usdaKey||'')}" autocomplete="off" style="flex:1 1 180px"><button class="btn" id="uSave">Save key</button></div>
 <h3 style="margin-top:22px">Backup</h3><p class="small mute">${mode==='db'?'Your log is saved to your Claude account and syncs across your devices.':'Your log is saved on this device only.'} You can also copy everything as a backup, or paste a backup to restore it.</p>
 <div class="grid2"><button class="btn" id="bCopy">Copy backup</button><button class="btn" id="bShow">Restore backup</button></div><div id="bArea"></div>
 <button class="btn block" data-close style="margin-top:10px">Close</button>`);
 $('gSave').onclick=()=>{S.profile.goals={kcal:num($('gk').value)||g.kcal,p:num($('gp').value)??g.p,c:num($('gc').value)??g.c,f:num($('gf').value)??g.f};saveProfile();closeSheet();renderAll();toast('Goals saved')};
 $('uSave').onclick=()=>{S.profile.usdaKey=$('uKey').value.trim();saveProfile();toast('Key saved')};
 $('bCopy').onclick=async()=>{const txt=JSON.stringify(S);try{await navigator.clipboard.writeText(txt);toast('Backup copied')}catch(e){$('bArea').innerHTML='<p class="small mute">Copy this text:</p><textarea readonly></textarea>';$('bArea').querySelector('textarea').value=txt}};
 $('bShow').onclick=()=>{$('bArea').innerHTML='<p class="small mute">Paste a backup. This replaces the current log.</p><textarea id="bIn"></textarea><button class="btn dark block" id="bGo" style="margin-top:8px">Restore</button>';
  $('bGo').onclick=()=>{try{const j=JSON.parse($('bIn').value);if(!j.profile||!j.days)throw 0;const oldDays=Object.keys(S.days);S.profile=Object.assign({goals:G(),foods:{},ex:[]},j.profile);S.days=j.days;saveProfile();new Set([...oldDays,...Object.keys(S.days)]).forEach(saveDay);closeSheet();renderAll();toast('Backup restored')}catch(e){toast('That doesn\'t look like a backup')}}};
};

/* ---------- render ---------- */
function renderAll(){
 $('dLabel').textContent=cur===today()?'Today, '+fmt(cur,{day:'numeric',month:'short'}):fmt(cur);
 if(view==='train')renderTrain();if(view==='food')renderFood();if(view==='prog')renderProg();if(view==='weight')renderWeight();
}
const ro=new ResizeObserver(()=>{if(view==='prog')drawProg();if(view==='weight')drawWeight()});ro.observe($('progSvg'));ro.observe($('bwSvg'));
loadLocal();renderAll();initDb();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
